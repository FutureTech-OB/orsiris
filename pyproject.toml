[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-research"
version = "0.1.0"
description = "Organizational and social inquiry through representation inspection and steering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
hf = ["transformers>=4.57,<6", "accelerate>=1,<2", "safetensors>=0.4", "numpy>=1.26,<3"]

[project.scripts]
osiris = "repsteer.cli:main"
repsteer = "repsteer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
